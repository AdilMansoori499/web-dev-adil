<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD</title>
</head>
<style>
    body{
        background-color:grey
    }
    .card{
        height: 610px;
        width:360px;
        border: 3px solid black;
        position:absolute;
        background-color:white;
        border-radius:10px;
    }
    .img img{
        padding: 3px;
        margin:3px;
        border-radius:10px;
        position:absolute;
    }
    .capsule span{
    position:relative;
    top:360px;
    left: 8px;
    border:2px solid black;
    border-radius:6px;
    margin:3px;
    padding:3px;
    }
    .content{
        position:relative;
        top:340px;
        margin:5px;
        padding:2px;
    }
    .button button{
        position:relative;
        top:360px;
        left:125px;
        border-radius:5px;
        color:rgb(94, 94, 189);
        background-color:rgb(110, 183, 231);
    }

</style>
<body>
<div class="card">
    <div class="img"> <img src="dark.jpg" width="344px" alt="">
  </div> 
  <div class="capsule">
<span>dark</span>
<span>demon</span>
    
  </div>   
  <div class="content">
    <h1>dark demon</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Illum animi ipsa corporis reprehenderit facilis ducimus delectus praesentium ex fugiat. Quod vel deleniti illo voluptatibus modi ex maiores autem quaerat eligendi.</p>
  </div>
  <div class="button">
<button>learn more</button>    
  </div>
</div>    
    
    
</body>
</html>
